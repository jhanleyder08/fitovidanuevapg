<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Fitovida Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2d6a4f 0%, #52b788 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .login-left {
            background: linear-gradient(135deg, #1b4332 0%, #2d6a4f 100%);
            padding: 3rem;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .products-slideshow {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            overflow: hidden;
            margin-bottom: 2rem;
            position: relative;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            border: 5px solid rgba(255, 255, 255, 0.2);
        }

        .product-slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            background-size: cover;
            background-position: center;
            animation: slideZoom 25s infinite;
        }

        .product-slide.active {
            opacity: 1;
        }

        .product-slide:nth-child(1) {
            background-image: url('img/PHOTO-2025-06-24-16-41-57.jpg');
            animation-delay: 0s;
        }

        .product-slide:nth-child(2) {
            background-image: url('img/PHOTO-2025-06-24-16-44-04.jpg');
            animation-delay: 5s;
        }

        .product-slide:nth-child(3) {
            background-image: url('img/PHOTO-2025-06-24-16-44-05.jpg');
            animation-delay: 10s;
        }

        .product-slide:nth-child(4) {
            background-image: url('img/PHOTO-2025-06-24-16-44-09.jpg');
            animation-delay: 15s;
        }

        .product-slide:nth-child(5) {
            background-image: url('img/PHOTO-2025-06-24-16-44-10.jpg');
            animation-delay: 20s;
        }

        @keyframes slideZoom {
            0%, 20% {
                opacity: 0;
                transform: scale(1);
            }
            25%, 45% {
                opacity: 1;
                transform: scale(1.05);
            }
            50%, 100% {
                opacity: 0;
                transform: scale(1.1);
            }
        }

        .products-slideshow::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle, transparent 30%, rgba(27, 67, 50, 0.6) 100%);
            z-index: 1;
            pointer-events: none;
        }

        .login-left i {
            font-size: 5rem;
            margin-bottom: 2rem;
            color: #95d5b2;
            display: none;
        }

        .login-left h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .login-left p {
            font-size: 1.1rem;
            opacity: 0.9;
            line-height: 1.6;
        }

        .login-right {
            padding: 3rem;
        }

        .login-header {
            margin-bottom: 2rem;
        }

        .login-header h2 {
            color: #2d6a4f;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: #6c757d;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #2d6a4f;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #52b788;
        }

        .form-group input {
            width: 100%;
            padding: 1rem 1rem 1rem 45px;
            border: 2px solid #d8f3dc;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #52b788;
            box-shadow: 0 0 0 3px rgba(82, 183, 136, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #2d6a4f 0%, #52b788 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(45, 106, 79, 0.3);
        }

        .alert {
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .login-footer {
            margin-top: 2rem;
            text-align: center;
        }

        .login-footer a {
            color: #52b788;
            text-decoration: none;
            font-weight: 600;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .login-container {
                grid-template-columns: 1fr;
            }

            .login-left {
                padding: 2rem;
            }

            .products-slideshow {
                width: 200px;
                height: 200px;
            }

            .login-left h1 {
                font-size: 2rem;
            }

            .login-left i {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-left">
            <div class="products-slideshow">
                <div class="product-slide active"></div>
                <div class="product-slide"></div>
                <div class="product-slide"></div>
                <div class="product-slide"></div>
                <div class="product-slide"></div>
            </div>
            <i class="fas fa-leaf"></i>
            <h1>Fitovida</h1>
            <p>Panel de Administración</p>
            <p style="margin-top: 1rem; font-size: 0.9rem;">Gestiona productos, precios y contenido de tu tienda naturista</p>
        </div>
        
        <div class="login-right">
            <div class="login-header">
                <h2>Iniciar Sesión</h2>
                <p>Accede al panel de administración</p>
            </div>

            <div id="alertMessage" class="alert"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                </button>
            </form>

            <div class="login-footer">
                <a href="index.html">
                    <i class="fas fa-arrow-left"></i> Volver a la tienda
                </a>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        // Slideshow de productos
        let currentSlide = 0;
        const slides = document.querySelectorAll('.product-slide');
        const totalSlides = slides.length;

        function showNextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % totalSlides;
            slides[currentSlide].classList.add('active');
        }

        // Cambiar slide cada 5 segundos
        setInterval(showNextSlide, 5000);

        // Redirigir si ya está autenticado
        if (auth.isAuthenticated()) {
            window.location.href = 'admin.html';
        }

        // Manejar el login
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const alertDiv = document.getElementById('alertMessage');
            
            const result = auth.login(username, password);
            
            if (result.success) {
                showAlert('Inicio de sesión exitoso. Redirigiendo...', 'success');
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 1000);
            } else {
                showAlert(result.message, 'error');
            }
        });

        function showAlert(message, type) {
            const alertDiv = document.getElementById('alertMessage');
            alertDiv.className = `alert alert-${type} show`;
            alertDiv.innerHTML = `<i class="fas fa-${type === 'error' ? 'exclamation-circle' : 'check-circle'}"></i> ${message}`;
            
            if (type === 'error') {
                setTimeout(() => {
                    alertDiv.classList.remove('show');
                }, 5000);
            }
        }
    </script>
</body>
</html>
